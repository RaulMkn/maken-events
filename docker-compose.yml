services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      DATABASE_PATH: /app/data/fiesta.sqlite
      SESSION_SECRET: ${SESSION_SECRET}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
      STAFF_PASSWORD: ${STAFF_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-entradas@maken-events.app}
      PARTY_NAME: ${PARTY_NAME:-Fiesta de Halloween}
    volumes:
      # Persistimos la base de datos fuera del contenedor.
      - fiesta_data:/app/data
    # No exponemos el backend directamente a internet: solo Caddy habla con él.
    expose:
      - "3000"
    networks:
      - interna

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistimos certificados TLS para no re-emitirlos en cada arranque.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - interna

volumes:
  fiesta_data:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
